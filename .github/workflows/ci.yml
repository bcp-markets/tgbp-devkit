name: CI

on:
  push:
  pull_request:
  # The token registry can drift when tGBP changes, with no push here.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # anvil runs the EVM tests against a local chain.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # npm publish silently drops package.json fields it would "fix", such as a
      # ./-prefixed bin path, so the release would ship without tgbp-mcp.
      - name: Check npm has nothing to fix in package.json
        run: npm pkg fix && git diff --exit-code package.json
      # Only the publish workflow stamps a real version, from the release tag.
      - name: Check package.json carries the 0.0.0-tagged placeholder
        run: test "$(node -p "require('./package.json').version")" = 0.0.0-tagged

  registry-drift:
    name: Token registry matches tGBP
    # The tGBP contracts repo is private. Its name, the registry paths in it and
    # the deploy key that reads it are secrets in the tgbp-source environment,
    # which only main may use, so the public log masks them. This runs on main
    # and on the daily schedule, never for a pull request.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    environment: tgbp-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # An empty repository input would check out this public repo instead.
      - name: Check the tgbp-source secrets are set
        env:
          REPO: ${{ secrets.TGBP_SOURCE_REPO }}
          CHAINS: ${{ secrets.TGBP_REGISTRY_CHAINS }}
          SOLANA: ${{ secrets.TGBP_REGISTRY_SOLANA }}
        run: test -n "$REPO" && test -n "$CHAINS" && test -n "$SOLANA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the tGBP sources the registry is generated from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.TGBP_SOURCE_REPO }}
          ref: main
          path: .tgbp-source
          ssh-key: ${{ secrets.TGBP_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ${{ secrets.TGBP_REGISTRY_CHAINS }}
            ${{ secrets.TGBP_REGISTRY_SOLANA }}
            contracts/StableTokenV1OFT.sol
            deployments
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/registry-drift.test.ts
        env:
          TGBP_SOURCE_DIR: .tgbp-source
          TGBP_REGISTRY_CHAINS: ${{ secrets.TGBP_REGISTRY_CHAINS }}
          TGBP_REGISTRY_SOLANA: ${{ secrets.TGBP_REGISTRY_SOLANA }}
          TGBP_REQUIRE_SOURCE: '1'

  api-drift:
    name: API types match the pinned spec; no provider names
    # The API spec repo is private: its name, the vendor-name guard's path and
    # its deploy key are tgbp-source secrets, as for registry-drift.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    environment: tgbp-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tgbp-source secrets are set
        env:
          REPO: ${{ secrets.TGBP_API_SPEC_REPO }}
          GUARD: ${{ secrets.TGBP_VENDOR_GUARD }}
        run: test -n "$REPO" && test -n "$GUARD"
      - name: Read the pinned spec commit
        id: pin
        run: |
          sha="$(cat api-spec.lock)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "api-spec.lock is not a commit SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned API specs and the vendor-name guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.TGBP_API_SPEC_REPO }}
          ref: ${{ steps.pin.outputs.sha }}
          path: .api-spec
          ssh-key: ${{ secrets.TGBP_API_SPEC_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            openapi.yaml
            openapi-swap.yaml
            ${{ secrets.TGBP_VENDOR_GUARD }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/api-drift.test.ts
        env:
          TGBP_API_SPEC_DIR: .api-spec
          TGBP_VENDOR_GUARD: ${{ secrets.TGBP_VENDOR_GUARD }}
          TGBP_REQUIRE_SOURCE: '1'
      # The sweep covers the build output too, since that is what npm publishes.
      - run: pnpm build
      - run: pnpm check:disclosure --require-dist
        env:
          TGBP_API_SPEC_DIR: .api-spec
          TGBP_VENDOR_GUARD: ${{ secrets.TGBP_VENDOR_GUARD }}

  sandbox:
    name: Mint and redeem on sandbox.tgbp.io
    # The staging API key and the sandbox record ids are secrets in the sandbox
    # environment, which only main may use. Secrets keep the ids out of public logs.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    environment: sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/sandbox.integration.test.ts
        env:
          TGBP_REQUIRE_SANDBOX: '1'
          TGBP_SANDBOX_API_KEY: ${{ secrets.TGBP_SANDBOX_API_KEY }}
          TGBP_SANDBOX_CUSTOMER_ID: ${{ secrets.TGBP_SANDBOX_CUSTOMER_ID }}
          TGBP_SANDBOX_ADDRESS: ${{ secrets.TGBP_SANDBOX_ADDRESS }}
          TGBP_SANDBOX_BANK_ID: ${{ secrets.TGBP_SANDBOX_BANK_ID }}
          TGBP_SANDBOX_CHAIN: ${{ secrets.TGBP_SANDBOX_CHAIN }}
